[project]
name = "one-voice"
version = "0.1.2"
description = "Local text-to-speech on Apple Silicon using Qwen3-TTS and MLX, with voice cloning"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Ken Chen", email = "ken.chen@simagix.com"},
]
keywords = ["tts", "text-to-speech", "qwen", "mlx", "voice-cloning", "apple-silicon"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "mlx-audio>=0.5.0",
    "mlx-whisper>=0.4.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/simagix/one-voice"
Repository = "https://github.com/simagix/one-voice.git"
Issues = "https://github.com/simagix/one-voice/issues"

[project.scripts]
one-voice = "one_voice:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["one_voice"]

[tool.setuptools.packages.find]
include = ["one_voice*"]
exclude = ["examples*", "experiments*", "output*", "voices*"]